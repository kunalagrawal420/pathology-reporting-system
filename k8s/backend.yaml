apiVersion: apps/v1
kind: Deployment
metadata:
  name: pathology-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pathology-backend
  template:
    metadata:
      labels:
        app: pathology-backend
    spec:
      containers:
        - name: backend
          image: 843414937188.dkr.ecr.us-east-1.amazonaws.com/pathology-backend:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://pathology-db.cy34mqmqmm0i.us-east-1.rds.amazonaws.com:5432/pathology_lab
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pathology-db-secret
                  key: DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pathology-db-secret
                  key: DB_PASSWORD
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: pathology-backend
spec:
  type: ClusterIP
  selector:
    app: pathology-backend
  ports:
    - port: 8080
      targetPort: 8080