name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build backend
        run: ./mvnw clean package -DskipTests

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Build and Push Docker Images to ECR
    needs:
      - backend
      - frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::843414937188:role/GitHubActionsPathologyECR
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            843414937188.dkr.ecr.us-east-1.amazonaws.com/pathology-backend:${{ github.sha }}
            843414937188.dkr.ecr.us-east-1.amazonaws.com/pathology-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            843414937188.dkr.ecr.us-east-1.amazonaws.com/pathology-frontend:${{ github.sha }}
            843414937188.dkr.ecr.us-east-1.amazonaws.com/pathology-frontend:latest

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name pathology-cluster

      - name: Update Kubernetes image tags
        run: |
          sed -i "s|pathology-backend:.*|pathology-backend:${GITHUB_SHA}|" k8s/backend.yaml
          sed -i "s|pathology-frontend:.*|pathology-frontend:${GITHUB_SHA}|" k8s/frontend.yaml

      - name: Deploy to EKS
        run: |
          set -e

          kubectl apply -f k8s/backend.yaml
          kubectl apply -f k8s/frontend.yaml

          if ! kubectl rollout status deployment/pathology-backend --timeout=180s; then
            echo "Backend deployment failed. Rolling back..."
            kubectl rollout undo deployment/pathology-backend
            exit 1
          fi

          if ! kubectl rollout status deployment/pathology-frontend --timeout=180s; then
            echo "Frontend deployment failed. Rolling back..."
            kubectl rollout undo deployment/pathology-frontend
            exit 1
          fi